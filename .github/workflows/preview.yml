name: Preview

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  # @morinoparty/chlorophyll-react を GitHub Packages から取得するために必要
  packages: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # R2 は S3 互換 API なので aws-cli をそのまま使う。
  AWS_EC2_METADATA_DISABLED: true
  AWS_REGION: auto
  AWS_CLI_FILE_ENCODING: UTF-8
  AWS_DEFAULT_S3_SIGNATURE_VERSION: s3v4
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  S3_UPLOAD_BUCKET: ${{ secrets.S3_UPLOAD_BUCKET }}
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  # アップロード先バケットが公開されているドメイン。
  PREVIEW_BASE_URL: https://moripa-ci.nikomaru.dev/kodama
  # S3 とプレビュー URL で共通利用するプロジェクトのパスプレフィックス。
  PROJECT_PATH: kodama

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_deployment_url: ${{ steps.resolve-preview-urls.outputs.app_deployment_url }}
      storybook_deployment_url: ${{ steps.resolve-preview-urls.outputs.storybook_deployment_url }}
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7

      # プレビュー成果物の置き場所はコミット単位。PR ではマージコミットではなく、
      # PR のブランチ先頭のコミットを使う(PR のコミットハッシュと一致させるため)。
      - name: Set short commit SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      # private パッケージ (@morinoparty/chlorophyll-react) 取得用の GitHub Packages 認証。
      # レジストリ指定はリポジトリの .npmrc にあるので、トークン行だけを足す
      - name: Setup npm auth for GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # styled-system は生成物なのでリポジトリに含めていない。
      # install 時の prepare でも生成されるが、確実に揃えるため明示的に実行する
      - name: Panda codegen
        run: pnpm run panda:codegen

      # サイドバーのフッターに出すデプロイ時刻。ビルド時に埋め込まれる
      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      # app と storybook をまとめてビルドする。storybook worker は storybook-static を
      # 静的アセットとして配信するため、アップロード前にビルドしておく必要がある
      - name: Build
        run: pnpm run build:all

      # デプロイトークンは BSM morinoparty プロジェクトの shared/CLOUDFLARE_API_TOKEN から取得
      # (Secrets Store バインディング付きデプロイには Secrets Store Edit 権限が必要なため)
      - name: Get deploy token from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            d1a5c5d9-41cc-48f0-9035-b49901583491 > CLOUDFLARE_API_TOKEN

      # sm-action は env にしか出さないため、wrangler-action の with: から参照できるよう output 化
      - name: Expose deploy token as step output
        id: bws-deploy
        run: echo "cloudflare_api_token=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_OUTPUT"

      # 片方のデプロイが落ちても、もう片方の URL は PR に出したいので
      # ここでジョブを止めず、後段の URL 解決でまとめて判定する
      - name: Deploy app preview
        id: deploy-app-preview
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.bws-deploy.outputs.cloudflare_api_token }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: app
          # 本番 worker (kodama) の未昇格バージョンとしてアップロードし、preview URL を得る
          command: versions upload --message "Deployed app by GitHub Actions branch ${{ github.ref_name }}"

      # kodama-storybook worker がまだ一度も deploy されていないと
      # `versions upload` は失敗する。その場合もジョブは続行させる
      - name: Deploy storybook preview
        id: deploy-storybook-preview
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.bws-deploy.outputs.cloudflare_api_token }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: storybook
          # 本番 worker (kodama-storybook) の未昇格バージョンとしてアップロードし、preview URL を得る
          command: versions upload --message "Deployed storybook by GitHub Actions branch ${{ github.ref_name }}"

      # wrangler-action の deployment-url output が空になることがあるため、
      # そのときは wrangler のログから URL を拾う。app / storybook の両方に同じ処理を適用する
      - name: Resolve preview URLs
        id: resolve-preview-urls
        env:
          APP_DEPLOYMENT_URL: ${{ steps.deploy-app-preview.outputs.deployment-url }}
          APP_COMMAND_OUTPUT: ${{ steps.deploy-app-preview.outputs.command-output }}
          APP_COMMAND_STDERR: ${{ steps.deploy-app-preview.outputs.command-stderr }}
          STORYBOOK_DEPLOYMENT_URL: ${{ steps.deploy-storybook-preview.outputs.deployment-url }}
          STORYBOOK_COMMAND_OUTPUT: ${{ steps.deploy-storybook-preview.outputs.command-output }}
          STORYBOOK_COMMAND_STDERR: ${{ steps.deploy-storybook-preview.outputs.command-stderr }}
        run: |
          resolve_url() {
            name="$1"
            url="$2"
            output="$3"
            stderr="$4"

            if [ -z "$url" ]; then
              url=$(printf '%s\n%s\n' "$output" "$stderr" \
                | grep -Eo 'https://[^[:space:]]+' | head -n 1 || true)
            fi

            if [ -z "$url" ]; then
              echo "::warning::failed to resolve the $name preview URL"
              return 1
            fi

            echo "${name}_deployment_url=$url" >> "$GITHUB_OUTPUT"
          }

          # 片方だけ落ちたときは警告にとどめ、取れた方の URL を PR に出す。
          # 両方取れなかったときだけジョブを失敗させる
          resolved=0
          resolve_url app "$APP_DEPLOYMENT_URL" "$APP_COMMAND_OUTPUT" "$APP_COMMAND_STDERR" && resolved=1
          resolve_url storybook "$STORYBOOK_DEPLOYMENT_URL" "$STORYBOOK_COMMAND_OUTPUT" "$STORYBOOK_COMMAND_STDERR" && resolved=1

          if [ "$resolved" -eq 0 ]; then
            echo "Failed to resolve any preview URL from wrangler-action outputs."
            exit 1
          fi

  comment:
    name: Comment Preview URL
    needs: deploy-preview
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # QR が作れなくてもプレビュー URL のコメントは出したいので、失敗しても続行する。
      - name: Install qrencode
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qrencode

      # GitHub の Markdown は data: URI の画像を表示しないため、QR は R2 へ置いて参照する。
      - name: Render and upload QR codes
        id: qr
        env:
          COMMIT_SHORT_SHA: ${{ needs.deploy-preview.outputs.commit_sha }}
          APP_PREVIEW_URL: ${{ needs.deploy-preview.outputs.app_deployment_url }}
          STORYBOOK_PREVIEW_URL: ${{ needs.deploy-preview.outputs.storybook_deployment_url }}
        run: |
          # QR は補助情報なので、生成や配置に失敗してもコメント投稿までは止めない。
          # 文字列は引数ではなく stdin へ渡し、URL が - で始まる場合でも壊れないようにする。
          # アップロード先は行ごとに分ける (qr/app.png と qr/storybook.png)。
          upload_qr() {
            name="$1"
            url="$2"
            [ -n "$url" ] || return 0

            if ! printf '%s' "$url" | qrencode -o "$name.png" -s 6 -m 2; then
              echo "::warning::failed to render the $name QR code"
              return 0
            fi
            if [ ! -s "$name.png" ]; then
              echo "::warning::the rendered $name QR code is empty"
              return 0
            fi

            if ! aws s3 cp "$name.png" \
              "s3://${S3_UPLOAD_BUCKET}/${PROJECT_PATH}/${COMMIT_SHORT_SHA}/qr/$name.png" \
              --endpoint-url "${S3_ENDPOINT}" \
              --content-type image/png \
              --only-show-errors; then
              echo "::warning::failed to upload the $name QR code"
              return 0
            fi

            echo "${name}_qr_url=${PREVIEW_BASE_URL}/${COMMIT_SHORT_SHA}/qr/$name.png" >> "$GITHUB_OUTPUT"
          }

          upload_qr app "$APP_PREVIEW_URL"
          upload_qr storybook "$STORYBOOK_PREVIEW_URL"

      - name: Create comment file
        env:
          APP_PREVIEW_URL: ${{ needs.deploy-preview.outputs.app_deployment_url }}
          STORYBOOK_PREVIEW_URL: ${{ needs.deploy-preview.outputs.storybook_deployment_url }}
          APP_QR_URL: ${{ steps.qr.outputs.app_qr_url }}
          STORYBOOK_QR_URL: ${{ steps.qr.outputs.storybook_qr_url }}
        run: |
          # 表の 1 行を組み立てる。URL が無い場合も行は残し、状態が読み取れるようにする。
          row() {
            label="$1"
            url="$2"
            qr="$3"
            if [ -z "$url" ]; then
              printf '| %s | Not available | — |\n' "$label" >> comment.md
              return
            fi
            if [ -n "$qr" ]; then
              printf '| %s | <%s> | <img src="%s" width="120" height="120" alt="%s preview QR code"> |\n' \
                "$label" "$url" "$qr" "$label" >> comment.md
            else
              printf '| %s | <%s> | — |\n' "$label" "$url" >> comment.md
            fi
          }

          cat << 'EOF' > comment.md
          ## 🚀 Deploy preview

          | Target | URL | QR |
          | --- | --- | --- |
          EOF

          row App "$APP_PREVIEW_URL" "$APP_QR_URL"
          row Storybook "$STORYBOOK_PREVIEW_URL" "$STORYBOOK_QR_URL"

          cat << 'EOF' >> comment.md

          スマートフォンから開く場合は QR を読み取ってください。
          EOF

      # push のたびにコメントが増えないよう、同じコメントを上書きしていく。
      - name: Create PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # comment ジョブは checkout しないため .git が無い。gh がリポジトリを
          # git から推測できず失敗するので、GH_REPO で対象リポジトリを明示する。
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub API が一時的に 503 を返すことがあるため数回まで再試行する。
          for attempt in 1 2 3; do
            if gh pr comment "${{ github.event.number }}" \
              --body-file comment.md --edit-last --create-if-none; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to post the preview comment after 3 attempts."
          exit 1
