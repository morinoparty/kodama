name: Preview

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # R2 (S3 互換 API) への接続情報。バケット・エンドポイント・認証情報・公開 URL は
  # すべて MORINOPARTY_CI_* の organization secret からまとめて取る (古い secret と混ぜない)
  AWS_ACCESS_KEY_ID: ${{ secrets.MORINOPARTY_CI_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MORINOPARTY_CI_AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.MORINOPARTY_CI_AWS_REGION }}
  S3_UPLOAD_BUCKET: ${{ secrets.MORINOPARTY_CI_S3_UPLOAD_BUCKET }}
  S3_ENDPOINT: ${{ secrets.MORINOPARTY_CI_S3_ENDPOINT }}
  # アップロード先バケットが公開されているドメイン (末尾スラッシュなし)。
  S3_PUBLIC_URL: ${{ secrets.MORINOPARTY_CI_S3_PUBLIC_URL }}
  # S3 とプレビュー URL で共通利用するプロジェクトのパスプレフィックス。
  PROJECT_PATH: kodama

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"
    outputs:
      app_deployment_url: ${{ steps.resolve-preview-urls.outputs.app_deployment_url }}
      storybook_deployment_url: ${{ steps.resolve-preview-urls.outputs.storybook_deployment_url }}
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v7

      # プレビュー成果物の置き場所はコミット単位。PR ではマージコミットではなく、
      # PR のブランチ先頭のコミットを使う(PR のコミットハッシュと一致させるため)。
      - name: Set short commit SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      # pnpm (package.json の packageManager) と Node (.node-version) をまとめて入れる。
      # pnpm/action-setup の self-installer (npm 経由) を使わないので速い
      - uses: pnpm/setup@v3
        with:
          cache: true      # pnpm store を lockfile ごとにキャッシュ
          install: false   # --frozen-lockfile を付けて下の Install ステップで入れる

      - name: Install
        run: pnpm install --frozen-lockfile

      # styled-system は生成物なのでリポジトリに含めていない。
      # install 時の prepare でも生成されるが、確実に揃えるため明示的に実行する
      - name: Panda codegen
        run: pnpm run panda:codegen

      # サイドバーのフッターに出すデプロイ時刻。ビルド時に埋め込まれる
      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      # app は cf previews deploy がプレビュー用にビルドし、その Vite ビルドが
      # storybook-static を client アセットの /storybook/ に同梱する。
      # そのため cf previews deploy の前に Storybook をビルドしておく必要がある
      - name: Build storybook static files
        run: pnpm run build:storybook

      # cf previews deploy は結果を JSON で標準出力に出す (preview 名は PR のブランチ名)
      # preview は本番の secret を引き継がず、cf previews deploy には --secrets-file も無い。
      # AUTH_SECRET / MINEAUTH_SERVICE_TOKEN は、Worker kodama の Previews Base secret に
      # 人がダッシュボードで一度だけ登録しておく (登録後に作られた preview にだけ入る。README 参照)
      - name: Deploy app preview
        id: deploy-app-preview
        working-directory: app
        run: pnpm exec cf previews deploy > "$RUNNER_TEMP/app-preview.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # cf previews deploy の JSON (preview_urls / deployment_urls) から URL を取り出す。
      # JSON として読めない場合は出力中の最初の https URL を拾う。
      # Storybook は同じ Worker の /storybook/ 配下にあるので、app の URL から組み立てる
      - name: Resolve preview URLs
        id: resolve-preview-urls
        run: |
          file="$RUNNER_TEMP/app-preview.json"
          url=""

          if [ -s "$file" ]; then
            url=$(jq -r '[(.preview_urls, .deployment_urls) | .. | strings | select(startswith("https://"))] | first // empty' "$file" 2>/dev/null || true)
            if [ -z "$url" ]; then
              url=$(grep -Eo 'https://[^[:space:]"]+' "$file" | head -n 1 || true)
            fi
          fi

          if [ -z "$url" ]; then
            echo "Failed to resolve the preview URL from cf previews deploy output."
            exit 1
          fi

          url="${url%/}"
          echo "app_deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "storybook_deployment_url=$url/storybook/" >> "$GITHUB_OUTPUT"

  comment:
    name: Comment Preview URL
    needs: deploy-preview
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # QR の生成には Node の qrcode CLI を pnpm dlx で使う。
      # apt-get はランナーによって数分待たされることがあるため頼らない
      # checkout しないので package.json / .node-version が無い。
      # pnpm と Node のバージョンを明示し、依存の install もキャッシュもしない
      - uses: pnpm/setup@v3
        with:
          version: 12.14.0
          runtime: node@26
          install: false

      # rclone の最新リリースを入れる (apt の 1.60 は R2 への転送で NotImplemented が多発する)。
      # 取得したバイナリは actions のキャッシュに保存され、アクション自体の更新は Dependabot が行う
      - uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      # GitHub の Markdown は data: URI の画像を表示しないため、QR は R2 へ置いて参照する。
      - name: Render and upload QR codes
        id: qr
        env:
          COMMIT_SHORT_SHA: ${{ needs.deploy-preview.outputs.commit_sha }}
          APP_PREVIEW_URL: ${{ needs.deploy-preview.outputs.app_deployment_url }}
          STORYBOOK_PREVIEW_URL: ${{ needs.deploy-preview.outputs.storybook_deployment_url }}
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: Cloudflare
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ env.AWS_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ env.S3_ENDPOINT }}
          RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
        run: |
          # QR は補助情報なので、生成や配置に失敗してもコメント投稿までは止めない。
          # secret が空のまま進むと、誤ったキーにアップロードしたり PR コメントの URL が壊れたりするため、
          # その場合は QR を置かずにコメントだけ投稿する
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_ENDPOINT S3_UPLOAD_BUCKET S3_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is empty (check the MORINOPARTY_CI_* organization secrets); skipping QR upload"
              exit 0
            fi
          done

          # URL が - で始まっても引数として解釈されないよう -- で区切る。
          # 生成した QR は qr/app.png と qr/storybook.png にまとめ、最後に 1 回で送る
          mkdir -p qr
          render_qr() {
            name="$1"
            url="$2"
            [ -n "$url" ] || return 0

            if ! pnpm dlx qrcode -o "qr/$name.png" -t png -s 6 -m 2 -- "$url"; then
              echo "::warning::failed to render the $name QR code"
              rm -f "qr/$name.png"
              return 0
            fi
            if [ ! -s "qr/$name.png" ]; then
              echo "::warning::the rendered $name QR code is empty"
              rm -f "qr/$name.png"
            fi
          }

          render_qr app "$APP_PREVIEW_URL"
          render_qr storybook "$STORYBOOK_PREVIEW_URL"

          if [ -z "$(ls -A qr)" ]; then
            echo "No QR codes to upload"
            exit 0
          fi

          prefix="${PROJECT_PATH}/${COMMIT_SHORT_SHA}/qr"
          if ! rclone copy ./qr "s3:${S3_UPLOAD_BUCKET}/${prefix}" \
            --transfers=32 --checkers=32 --stats=5s --stats-one-line -v; then
            echo "::warning::failed to upload the QR codes"
            exit 0
          fi

          for file in qr/*.png; do
            name="$(basename "$file" .png)"
            echo "${name}_qr_url=${S3_PUBLIC_URL}/${prefix}/${name}.png" >> "$GITHUB_OUTPUT"
          done

      - name: Create comment file
        env:
          APP_PREVIEW_URL: ${{ needs.deploy-preview.outputs.app_deployment_url }}
          STORYBOOK_PREVIEW_URL: ${{ needs.deploy-preview.outputs.storybook_deployment_url }}
          APP_QR_URL: ${{ steps.qr.outputs.app_qr_url }}
          STORYBOOK_QR_URL: ${{ steps.qr.outputs.storybook_qr_url }}
        run: |
          # 表の 1 行を組み立てる。URL が無い場合も行は残し、状態が読み取れるようにする。
          row() {
            label="$1"
            url="$2"
            qr="$3"
            if [ -z "$url" ]; then
              printf '| %s | Not available | — |\n' "$label" >> comment.md
              return
            fi
            if [ -n "$qr" ]; then
              printf '| %s | <%s> | <img src="%s" width="120" height="120" alt="%s preview QR code"> |\n' \
                "$label" "$url" "$qr" "$label" >> comment.md
            else
              printf '| %s | <%s> | — |\n' "$label" "$url" >> comment.md
            fi
          }

          cat << 'EOF' > comment.md
          ## 🚀 Deploy preview

          | Target | URL | QR |
          | --- | --- | --- |
          EOF

          row App "$APP_PREVIEW_URL" "$APP_QR_URL"
          row Storybook "$STORYBOOK_PREVIEW_URL" "$STORYBOOK_QR_URL"

          cat << 'EOF' >> comment.md

          スマートフォンから開く場合は QR を読み取ってください。
          EOF

      # push のたびにコメントが増えないよう、同じコメントを上書きしていく。
      - name: Create PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # comment ジョブは checkout しないため .git が無い。gh がリポジトリを
          # git から推測できず失敗するので、GH_REPO で対象リポジトリを明示する。
          GH_REPO: ${{ github.repository }}
        run: |
          # GitHub API が一時的に 503 を返すことがあるため数回まで再試行する。
          for attempt in 1 2 3; do
            if gh pr comment "${{ github.event.number }}" \
              --body-file comment.md --edit-last --create-if-none; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to post the preview comment after 3 attempts."
          exit 1
