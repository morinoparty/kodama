name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  # @morinoparty/chlorophyll-react を GitHub Packages から取得するために必要
  packages: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      # private パッケージ (@morinoparty/chlorophyll-react) 取得用の GitHub Packages 認証。
      # レジストリ指定はリポジトリの .npmrc にあるので、トークン行だけを足す
      - name: Setup npm auth for GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # styled-system は生成物なのでリポジトリに含めていない。
      # install 時の prepare でも生成されるが、確実に揃えるため明示的に実行する
      - name: Panda codegen
        run: pnpm run panda:codegen

      # サイドバーのフッターに出すデプロイ時刻。ビルド時に埋め込まれる
      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      # app (vite build) と storybook (storybook build) をまとめてビルドする。
      # storybook worker は storybook-static を静的アセットとして配信するため、
      # デプロイ前にここでビルドしておく必要がある
      - name: Build
        run: pnpm run build:all

      # AUTH_SECRET は Cloudflare Secrets Store バインディング (BSM: shared/AUTH_SECRET) から
      # Worker 実行時に供給されるため、ここでの取得・wrangler secret put は不要。
      # デプロイトークンは BSM morinoparty プロジェクトの shared/CLOUDFLARE_API_TOKEN から取得
      # (Secrets Store バインディング付きデプロイには Secrets Store Edit 権限が必要なため)
      - name: Get deploy token from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            d1a5c5d9-41cc-48f0-9035-b49901583491 > CLOUDFLARE_API_TOKEN

      # sm-action は env にしか出さないため、wrangler-action の with: から参照できるよう output 化。
      # トークンの取得は 1 回だけ行い、app と storybook の両方のデプロイで使い回す
      - name: Expose deploy token as step output
        id: bws-deploy
        run: echo "cloudflare_api_token=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_OUTPUT"

      # 本番アプリ (worker: kodama / kodama.moripa.nikomaru.dev)
      - name: Deploy app
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.bws-deploy.outputs.cloudflare_api_token }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: app
          command: deploy

      # MINEAUTH_SERVICE_TOKEN は wrangler.jsonc に現れない実行時シークレット。
      # Worker Versions では未deployの最新versionがあると通常のsecret更新が拒否される。
      # 先にcodeをdeployし、そのversionに対してsecretを別stepで同期する。
      # (`wrangler secret put` は値を標準入力から受け取るので wrangler-action ではなく直接叩く)
      - name: Sync MineAuth service token
        working-directory: app
        run: printf '%s' "$MINEAUTH_SERVICE_TOKEN" | pnpm exec wrangler secret put MINEAUTH_SERVICE_TOKEN
        env:
          MINEAUTH_SERVICE_TOKEN: ${{ secrets.MINEAUTH_SERVICE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ steps.bws-deploy.outputs.cloudflare_api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Storybook (worker: kodama-storybook / story.kodama.moripa.nikomaru.dev)
      - name: Deploy storybook
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.bws-deploy.outputs.cloudflare_api_token }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: storybook
          command: deploy
