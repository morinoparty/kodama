# app (Worker "kodama") を cf でビルドし deploy する。
# Storybook は同じ Worker の静的アセットとして /storybook/ 配下で配信する
# (https://kodama.morinoparty.workers.dev/storybook/)。
#
# build + dry-run を行い、main のときだけ本番 deploy する。
# 必要な GitHub secrets (`gh secret set -f app/.env` で登録できる):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  … cf CLI 用 (Worker には渡さない)
#   AUTH_SECRET, MINEAUTH_SERVICE_TOKEN          … app の Worker secret (--secrets-file で渡す)
name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  # @morinoparty/chlorophyll-react を GitHub Packages から取得するために必要
  packages: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      # private パッケージ (@morinoparty/chlorophyll-react) 取得用の GitHub Packages 認証。
      # レジストリ指定はリポジトリの .npmrc にあるので、トークン行だけを足す
      - name: Setup npm auth for GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> .npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # styled-system は生成物なのでリポジトリに含めていない。
      # install 時の prepare でも生成されるが、確実に揃えるため明示的に実行する
      - name: Panda codegen
        run: pnpm run panda:codegen

      # サイドバーのフッターに出すデプロイ時刻。ビルド時に埋め込まれる
      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      # app の Vite ビルドが storybook-static を client アセットの /storybook/ に同梱するため、
      # cf build の前に Storybook をビルドしておく必要がある
      - name: Build storybook static files
        run: pnpm run build:storybook

      # app は Vite (Cloudflare Vite plugin) でビルドされ、mode は production が記録される
      - name: Build app
        working-directory: app
        run: pnpm exec cf build

      - name: Dry-run app
        working-directory: app
        run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      # 本番アプリ (worker: kodama / https://kodama.morinoparty.workers.dev、Storybook は /storybook/)。
      # Worker secret は GitHub secrets から一時ファイルを作り --secrets-file で version と一緒に渡す
      - name: Deploy app
        if: github.ref == 'refs/heads/main'
        working-directory: app
        run: |
          # 空の secret で上書きしないよう、揃っていなければ止める
          : "${AUTH_SECRET:?}" "${MINEAUTH_SERVICE_TOKEN:?}"
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          jq -n \
            --arg AUTH_SECRET "$AUTH_SECRET" \
            --arg MINEAUTH_SERVICE_TOKEN "$MINEAUTH_SERVICE_TOKEN" \
            '$ARGS.named' > "$secrets_file"
          pnpm exec cf deploy --prebuilt --mode production --secrets-file "$secrets_file"
          rm -f "$secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          MINEAUTH_SERVICE_TOKEN: ${{ secrets.MINEAUTH_SERVICE_TOKEN }}
