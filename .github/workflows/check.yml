name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm (package.json の packageManager) と Node (.node-version) をまとめて入れる。
      # pnpm/action-setup の self-installer (npm 経由) を使わないので速い
      - uses: pnpm/setup@v3
        with:
          cache: true      # pnpm store を lockfile ごとにキャッシュ
          install: false   # --frozen-lockfile を付けて下の Install ステップで入れる

      - name: Install
        run: pnpm install --frozen-lockfile

      # styled-system は生成物なのでリポジトリに含めていない。
      # install 時の prepare でも生成されるが、確実に揃えるため明示的に実行する
      - name: Panda codegen
        run: pnpm run panda:codegen

      # Biome の lint / format / import 整列をまとめて検査する (--write はしない)。
      # 設定はワークスペースルートに 1 つなので、ここでまとめて 1 回だけ実行する
      - name: Biome
        run: pnpm run check:ci

      # 型チェックは pnpm -r で app / storybook の両方を回す
      - name: Typecheck
        run: pnpm run typecheck

      # app と storybook はビルドの失敗箇所が分かるようステップを分けている。
      # app のビルドは storybook-static を client アセットの /storybook/ に同梱するため
      # (CI では無いと失敗する)、storybook を先にビルドする
      - name: Build storybook
        run: pnpm run build:storybook

      - name: Build app
        run: pnpm --filter @kodama/app build
